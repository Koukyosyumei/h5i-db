[package]
name = "lab-server"
description = "Research lab shell: ledger HTTP API, h5i-db worker, agent runner, fleet UI"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[dependencies]
lab-kernel = { path = "../kernel" }
h5i-app-core = { git = "https://github.com/h5i-dev/h5i", tag = "v0.5.0" }
h5i-app-pg = { git = "https://github.com/h5i-dev/h5i", tag = "v0.5.0" }
h5i-app-http = { git = "https://github.com/h5i-dev/h5i", tag = "v0.5.0" }
h5i-app-json = { git = "https://github.com/h5i-dev/h5i", tag = "v0.5.0" }
h5i-db-service = { path = "../../../crates/h5i-db-service" }
h5i-db-core = { path = "../../../crates/h5i-db-core" }
h5i-db-backtest = { path = "../../../crates/h5i-db-backtest" }
blake3 = "1"
axum = "0.8"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "process", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
arrow = { version = "58.3", default-features = false, features = ["ipc"] }
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = "0.5"
